<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tap Dodge Game</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
    }

    .game-wrap {
      width: min(92vw, 520px);
      text-align: center;
    }

    h1 {
      font-size: 1.15rem;
      margin: 0 0 0.35rem;
    }

    p {
      margin: 0.2rem 0;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    canvas {
      margin-top: 0.8rem;
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      border: 2px solid #334155;
      background: linear-gradient(#0b1220, #111827);
      touch-action: none;
      display: block;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    .btn {
      margin-top: 0.7rem;
      background: #38bdf8;
      color: #082f49;
      border: none;
      border-radius: 999px;
      padding: 0.45rem 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover {
      filter: brightness(1.04);
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <h1>Tap to Move & Dodge Obstacles</h1>
    <p>Tap anywhere in the play area to steer the orb toward your tap.</p>
    <p>Survive as long as possible while red blocks fall.</p>

    <canvas id="game" width="360" height="640" aria-label="Tap dodge game"></canvas>

    <div class="hud">
      <span id="score">Score: 0</span>
      <span id="best">Best: 0</span>
      <span id="state">Running</span>
    </div>

    <button id="restart" class="btn" type="button">Restart</button>
  </main>

  <script>
    (function() {
      var canvas = document.getElementById('game');
      var ctx = canvas.getContext('2d');
      var scoreEl = document.getElementById('score');
      var bestEl = document.getElementById('best');
      var stateEl = document.getElementById('state');
      var restartBtn = document.getElementById('restart');

      var target = { x: canvas.width / 2, y: canvas.height * 0.83 };
      var player = { x: target.x, y: target.y, r: 14, speed: 5.8 };
      var obstacles = [];
      var score = 0;
      var best = Number(localStorage.getItem('tapDodgeBest') || 0);
      var running = true;
      var frame = 0;

      bestEl.textContent = 'Best: ' + best;

      function reset() {
        target.x = canvas.width / 2;
        target.y = canvas.height * 0.83;
        player.x = target.x;
        player.y = target.y;
        obstacles = [];
        score = 0;
        frame = 0;
        running = true;
        stateEl.textContent = 'Running';
        scoreEl.textContent = 'Score: 0';
      }

      function spawnObstacle() {
        var width = 35 + Math.random() * 80;
        obstacles.push({
          x: Math.random() * (canvas.width - width),
          y: -30,
          w: width,
          h: 18 + Math.random() * 20,
          speed: 1.7 + Math.random() * 2.8
        });
      }

      function setTarget(clientX, clientY) {
        var rect = canvas.getBoundingClientRect();
        var scaleX = canvas.width / rect.width;
        var scaleY = canvas.height / rect.height;
        target.x = (clientX - rect.left) * scaleX;
        target.y = (clientY - rect.top) * scaleY;
      }

      canvas.addEventListener('pointerdown', function(e) {
        setTarget(e.clientX, e.clientY);
      });

      canvas.addEventListener('pointermove', function(e) {
        if (e.buttons === 1) {
          setTarget(e.clientX, e.clientY);
        }
      });

      restartBtn.addEventListener('click', reset);

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function collideRectCircle(rect, circle) {
        var nearestX = clamp(circle.x, rect.x, rect.x + rect.w);
        var nearestY = clamp(circle.y, rect.y, rect.y + rect.h);
        var dx = circle.x - nearestX;
        var dy = circle.y - nearestY;
        return dx * dx + dy * dy <= circle.r * circle.r;
      }

      function update() {
        if (!running) {
          return;
        }

        frame += 1;
        if (frame % 36 === 0) {
          spawnObstacle();
        }

        var dx = target.x - player.x;
        var dy = target.y - player.y;
        var dist = Math.hypot(dx, dy);
        if (dist > 0.5) {
          var step = Math.min(player.speed, dist);
          player.x += (dx / dist) * step;
          player.y += (dy / dist) * step;
        }

        player.x = clamp(player.x, player.r, canvas.width - player.r);
        player.y = clamp(player.y, player.r, canvas.height - player.r);

        for (var i = obstacles.length - 1; i >= 0; i--) {
          var o = obstacles[i];
          o.y += o.speed;

          if (collideRectCircle(o, player)) {
            running = false;
            stateEl.textContent = 'Game Over';
            if (score > best) {
              best = score;
              localStorage.setItem('tapDodgeBest', String(best));
              bestEl.textContent = 'Best: ' + best;
            }
            break;
          }

          if (o.y > canvas.height + 40) {
            obstacles.splice(i, 1);
            score += 1;
            scoreEl.textContent = 'Score: ' + score;
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#38bdf8';
        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(target.x, target.y);
        ctx.stroke();
        ctx.globalAlpha = 1;

        ctx.fillStyle = '#ef4444';
        for (var i = 0; i < obstacles.length; i++) {
          var o = obstacles[i];
          ctx.fillRect(o.x, o.y, o.w, o.h);
        }

        ctx.beginPath();
        ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
        ctx.fillStyle = '#22d3ee';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(target.x, target.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#a5f3fc';
        ctx.fill();
      }

      function tick() {
        update();
        draw();
        requestAnimationFrame(tick);
      }

      tick();
    })();
  </script>
</body>
</html>
